# `docker compose up` runs the whole stack with zero manual steps:
#   postgres  → initialised with least-privilege roles (deploy/postgres/init)
#   migrator  → same image, `--migrate-only`, connects as the schema owner, exits
#   api       → connects as the DML-only role, starts after migrations succeeded
# Optional: `docker compose --profile observability up` adds the Aspire dashboard as an OTLP backend
# (set OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889, see .env.example).
name: servicetemplate

x-api-image: &api-image
  image: servicetemplate-api:local
  build:
    context: .
    dockerfile: Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: servicetemplate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev-only}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:-migrator-dev-only}
      APP_PASSWORD: ${APP_PASSWORD:-app-dev-only}
    ports:
      # Loopback only: lets `dotnet run` (appsettings.Development.json) use this database.
      - "127.0.0.1:${POSTGRES_PORT:-58432}:5432"
    volumes:
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d servicetemplate"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrator:
    <<: *api-image
    command: ["--migrate-only"]
    environment:
      ConnectionStrings__Default: Host=postgres;Database=servicetemplate;Username=service_migrator;Password=${MIGRATOR_PASSWORD:-migrator-dev-only}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    ports:
      - "${API_PORT:-58080}:8080"
    environment:
      ConnectionStrings__Default: Host=postgres;Database=servicetemplate;Username=service_app;Password=${APP_PASSWORD:-app-dev-only};Timeout=5
      OpenApi__Enabled: "true"
      OTEL_SERVICE_NAME: servicetemplate-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      migrator:
        condition: service_completed_successfully
    # No container HEALTHCHECK: the chiseled image has no shell or curl. Orchestrators probe
    # /health/live and /health/ready over HTTP instead (see docs/adr/0003).
    restart: unless-stopped

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    profiles: ["observability"]
    environment:
      # Local-only convenience; never expose an unsecured dashboard beyond localhost.
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "127.0.0.1:58888:18888"

volumes:
  pgdata:
